<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#CED1CD" />
    <title>Brooks OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@0.7.0",
          "@tailwindcss/browser": "https://esm.sh/@tailwindcss/browser@^4.1.3"
        }
      }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      const safeError = window.onerror;
      window.onerror = function(message, source, lineno, colno, error) {
        if (typeof message === 'string' && message.includes('ResizeObserver')) {
          return true; // Suppress
        }
        if (safeError) return safeError(message, source, lineno, colno, error);
        return false;
      };
      window.addEventListener('error', function(e) {
        if (e.message.includes('ResizeObserver')) {
          e.stopImmediatePropagation();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
